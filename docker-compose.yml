version: '3.8'

services:

  qdrant:
    image: qdrant/qdrant:latest
    container_name: finpredict_qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  n8n:
    image: n8nio/n8n:latest
    container_name: finpredict_n8n
    ports:
      - "5678:5678"
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=admin
      - N8N_BASIC_AUTH_PASSWORD=changez_moi
      - WEBHOOK_URL=http://localhost:5678
    volumes:
      - n8n_data:/home/node/.n8n
    restart: unless-stopped

  app:
    build: .
    container_name: finpredict_app
    ports:
      - "8501:8501"
    environment:
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - N8N_WEBHOOK_URL=http://n8n:5678/webhook/decision-pret
    env_file:
      - .env
    volumes:
      - ./decisions_log.csv:/app/decisions_log.csv
      - ./artefacts_modele.pkl:/app/artefacts_modele.pkl
    depends_on:
      - qdrant
      - n8n
    restart: unless-stopped

  dashboard:
    build: .
    container_name: finpredict_dashboard
    ports:
      - "8502:8502"
    command: streamlit run dashboard_monitoring.py --server.port 8502
    environment:
      - QDRANT_HOST=qdrant
    env_file:
      - .env
    volumes:
      - ./decisions_log.csv:/app/decisions_log.csv
      - ./artefacts_modele.pkl:/app/artefacts_modele.pkl
    depends_on:
      - qdrant
    restart: unless-stopped

volumes:
  qdrant_data:
  n8n_data: